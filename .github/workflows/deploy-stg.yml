name: Deploy Frontend to Staging

on:
  push:
    branches:
      - dev
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jorgeariasg/medpal-ui-stg

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            latest

      # Note: Requires a Dockerfile in the repository root
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, frontend]

    steps:
      - name: Deploy to Local Homelab Server
        run: |
          # Navigate to the new DMZ infrastructure folder
          cd /home/runner/dmz-infra

          # Force pull the latest staging image from GHCR (using your PAT for private repos)
          docker compose -f docker-compose.dmz.yml pull medpal-ui

          # Recreate the container with the new image
          docker compose -f docker-compose.dmz.yml up -d --no-deps medpal-ui

          # Clean up old dangling images to save space
          docker image prune -f

