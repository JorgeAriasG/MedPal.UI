name: Deploy Frontend to Staging

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'UI/SchedulingAppUI/scheduling.ui/**'
      - '.github/workflows/deploy-frontend-stg.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/medpal-ui-stg

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            latest

      # Note: Requires a Dockerfile in the UI directory that builds Angular and serves with Nginx
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./UI/SchedulingAppUI/scheduling.ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Proxmox VM (Ubuntu Server) via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOMELAB_VM_IP }}
          username: ${{ secrets.HOMELAB_VM_USER }}
          key: ${{ secrets.HOMELAB_VM_SSH_KEY }}
          script: |
            # Navigate to the DevOps infrastructure folder
            cd /opt/medpal/infrastructure
            
            # Pull the latest staging image
            docker compose -f docker-compose.stg.yml pull frontend-stg
            
            # Recreate the container with the new image
            docker compose -f docker-compose.stg.yml up -d --no-deps frontend-stg
            
            # Clean up old dangling images to save space
            docker image prune -f
