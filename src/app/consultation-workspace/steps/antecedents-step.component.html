<div class="up-step">
  <div class="up-card">
    <div class="up-card-header">
      <mat-icon>history</mat-icon>
      <h3 class="up-card-title">{{ 'CONSULTATION_WORKSPACE.SECTION_CLINICAL_HISTORY' | translate }}</h3>
    </div>

    <app-history-timeline
      *ngIf="patientId"
      [patientId]="patientId"
      [historyEntries]="context?.medicalHistory || []">
    </app-history-timeline>
  </div>
</div>
