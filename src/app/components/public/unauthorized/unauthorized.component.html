<div class="unauthorized-container">
  <div class="unauthorized-card">
    <!-- Error Icon -->
    <div class="error-icon">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>

    <!-- Heading -->
    <h1>{{ 'UNAUTHORIZED.TITLE' | translate }}</h1>

    <!-- Error Message -->
    <p class="error-message">
      {{ 'UNAUTHORIZED.MESSAGE' | translate }}
    </p>

    <!-- Error Code -->
    <p class="error-code">{{ 'UNAUTHORIZED.CODE' | translate }}</p>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button
        (click)="goBack()"
        class="btn btn-primary"
        *ngIf="returnUrl"
        [attr.title]="'UNAUTHORIZED.BACK_TITLE' | translate"
      >
        {{ 'UNAUTHORIZED.GO_BACK' | translate }}
      </button>
      <button
        (click)="goHome()"
        class="btn btn-secondary"
        [attr.title]="'UNAUTHORIZED.HOME_TITLE' | translate"
      >
        {{ 'UNAUTHORIZED.GO_HOME' | translate }}
      </button>
    </div>

    <!-- Help Text -->
    <p class="help-text">
      {{ 'UNAUTHORIZED.HELP_TEXT' | translate }}
    </p>
  </div>
</div>
