<div class="complete-registration-container">
  <mat-card class="complete-registration-card">
    <mat-card-header>
      <mat-card-title>Completar Registro</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="!token" class="error-message">
        <p>Token inválido. Solicita un nuevo enlace de registro.</p>
      </div>

      <div *ngIf="success" class="success-message">
        <p>¡Registro completado! Serás redirigido...</p>
      </div>

      <form *ngIf="token && !success" [formGroup]="registrationForm" class="registration-form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo electrónico</mat-label>
          <input matInput formControlName="email" type="email" placeholder="tu@email.com" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput formControlName="password" type="password" />
          <mat-hint>Mínimo 6 caracteres</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirmar contraseña</mat-label>
          <input matInput formControlName="confirmPassword" type="password" />
          <mat-error *ngIf="registrationForm.hasError('mismatch')">
            Las contraseñas no coinciden
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nombre (opcional)</mat-label>
          <input matInput formControlName="name" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Apellido (opcional)</mat-label>
          <input matInput formControlName="lastname" />
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="submit-button"
          [disabled]="registrationForm.invalid || loading"
          type="submit"
        >
          <span *ngIf="!loading">Completar Registro</span>
          <span *ngIf="loading">Procesando...</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
