<mat-card class="filters-card">
  <mat-card-header class="filters-header">
    <mat-card-title>{{ 'AUDIT.REPORTS.TITLE' | translate }}</mat-card-title>
  </mat-card-header>

  <div class="filters-content">
    <form [formGroup]="filterForm" (ngSubmit)="onSubmit()">
      <div class="filter-row">
        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>{{ 'AUDIT.REPORTS.DATE_FROM' | translate }}</mat-label>
          <input
            matInput
            type="date"
            formControlName="dateFrom"
            [disabled]="isLoading"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>{{ 'AUDIT.REPORTS.DATE_TO' | translate }}</mat-label>
          <input
            matInput
            type="date"
            formControlName="dateTo"
            [disabled]="isLoading"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>{{ 'AUDIT.REPORTS.CLINIC_ID' | translate }}</mat-label>
          <input
            matInput
            type="number"
            formControlName="clinicId"
            [placeholder]="'COMMON.OPTIONAL' | translate"
            [disabled]="isLoading"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>{{ 'AUDIT.REPORTS.PATIENT_ID' | translate }}</mat-label>
          <input
            matInput
            type="number"
            formControlName="patientId"
            [placeholder]="'COMMON.OPTIONAL' | translate"
            [disabled]="isLoading"
          />
        </mat-form-field>
      </div>

      <div class="filter-actions">
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="isLoading"
          class="generate-btn"
        >
          <mat-icon>assessment</mat-icon>
          {{ 'AUDIT.REPORTS.GENERATE' | translate }}
        </button>

        <button
          mat-stroked-button
          type="button"
          (click)="onReset()"
          [disabled]="isLoading"
          class="reset-btn"
        >
          <mat-icon>refresh</mat-icon>
          {{ 'AUDIT.REPORTS.CLEAR_FILTERS' | translate }}
        </button>
      </div>
    </form>
  </div>
</mat-card>
