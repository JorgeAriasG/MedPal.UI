<div class="soap-container">
  <div class="soap-field">
    <label class="field-label">
      <span class="soap-letter">S</span>
      {{ 'MEDICAL_HISTORY.TEMPLATE_SOAP_SUBJECTIVE_LABEL' | translate }}
    </label>
    <mat-form-field appearance="outline" class="w-100">
      <textarea
        matInput
        [ngModel]="soapData.subjective"
        (ngModelChange)="soapData.subjective = $event; update()"
        rows="3"
        [placeholder]="'MEDICAL_HISTORY.TEMPLATE_SOAP_SUBJECTIVE_PLACEHOLDER_LONG' | translate"
      ></textarea>
    </mat-form-field>
  </div>

  <div class="soap-field">
    <label class="field-label">
      <span class="soap-letter">O</span>
      {{ 'MEDICAL_HISTORY.TEMPLATE_SOAP_OBJECTIVE_LABEL' | translate }}
    </label>
    <mat-form-field appearance="outline" class="w-100">
      <textarea
        matInput
        [ngModel]="soapData.objective"
        (ngModelChange)="soapData.objective = $event; update()"
        rows="3"
        [placeholder]="'MEDICAL_HISTORY.TEMPLATE_SOAP_OBJECTIVE_PLACEHOLDER_LONG' | translate"
      ></textarea>
    </mat-form-field>
  </div>

  <div class="soap-field">
    <label class="field-label">
      <span class="soap-letter">A</span>
      {{ 'MEDICAL_HISTORY.TEMPLATE_SOAP_ASSESSMENT_LABEL' | translate }}
    </label>
    <mat-form-field appearance="outline" class="w-100">
      <textarea
        matInput
        [ngModel]="soapData.assessment"
        (ngModelChange)="soapData.assessment = $event; update()"
        rows="3"
        [placeholder]="'MEDICAL_HISTORY.TEMPLATE_SOAP_ASSESSMENT_PLACEHOLDER_LONG' | translate"
      ></textarea>
    </mat-form-field>
  </div>

  <div class="soap-field">
    <label class="field-label">
      <span class="soap-letter">P</span>
      {{ 'MEDICAL_HISTORY.TEMPLATE_SOAP_PLAN_LABEL' | translate }}
    </label>
    <mat-form-field appearance="outline" class="w-100">
      <textarea
        matInput
        [ngModel]="soapData.plan"
        (ngModelChange)="soapData.plan = $event; update()"
        rows="3"
        [placeholder]="'MEDICAL_HISTORY.TEMPLATE_SOAP_PLAN_PLACEHOLDER_LONG' | translate"
      ></textarea>
    </mat-form-field>
  </div>

  <app-measurements
    [ngModel]="soapData.measurements"
    (ngModelChange)="onMeasurementsChange($event)"
  ></app-measurements>

  <!-- Consultation Engine compartidos -->
  <div class="engine-section" *ngIf="!hideEngine">
    <app-diagnoses
      [ngModel]="diagnosisValue"
      (ngModelChange)="onDiagnosisChange($event)"
    ></app-diagnoses>

    <app-treatments
      [ngModel]="soapData.treatments"
      (ngModelChange)="onTreatmentsChange($event)"
    ></app-treatments>

    <app-clinical-attachments
      [attachments]="soapData.attachments || []"
      (attachmentsChange)="onAttachmentsChange($event)"
    ></app-clinical-attachments>
  </div>
</div>
