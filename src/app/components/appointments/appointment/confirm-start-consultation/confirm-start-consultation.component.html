<div class="confirm-card">
  <div class="confirm-header">
    <div class="confirm-icon">
      <mat-icon>play_circle</mat-icon>
    </div>
    <h3 class="confirm-title">Iniciar consulta</h3>
  </div>

  <p class="confirm-text">
    Iniciar consulta para <strong>{{ data.patientName }}</strong>
    <ng-container *ngIf="data.appointmentTime">
      <span class="confirm-time">a las {{ data.appointmentTime }}</span>
    </ng-container>
  </p>

  <label class="skip-checkbox" (click)="$event.stopPropagation()">
    <mat-checkbox [(ngModel)]="skipFuture"></mat-checkbox>
    <span class="skip-label">No volver a preguntar</span>
  </label>

  <div class="confirm-actions">
    <button mat-stroked-button class="cancel-btn" (click)="onCancel()">Cancelar</button>
    <button mat-flat-button color="primary" class="start-btn" (click)="onConfirm()">
      <mat-icon>arrow_forward</mat-icon>
      Iniciar
    </button>
  </div>
</div>
