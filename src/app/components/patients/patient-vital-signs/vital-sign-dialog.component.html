<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="vital-sign-form">
    <div class="form-row">
      <mat-form-field appearance="outline" class="field-small">
        <mat-label>Fecha</mat-label>
        <input matInput [matDatepicker]="dp" formControlName="recordedDate" required>
        <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
        <mat-datepicker #dp></mat-datepicker>
        <mat-error *ngIf="form.get('recordedDate')?.hasError('required')">Requerido</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="field-small">
        <mat-label>Hora</mat-label>
        <input matInput type="time" formControlName="recordedTime" required>
        <mat-error *ngIf="form.get('recordedTime')?.hasError('required')">Requerido</mat-error>
      </mat-form-field>
    </div>

    <div class="form-section-title">Presión Arterial</div>
    <div class="form-row">
      <mat-form-field appearance="outline" class="field-small">
        <mat-label>Sistólica (mmHg)</mat-label>
        <input matInput type="number" formControlName="systolicBP" min="0" max="300" placeholder="120">
      </mat-form-field>
      <mat-form-field appearance="outline" class="field-small">
        <mat-label>Diastólica (mmHg)</mat-label>
        <input matInput type="number" formControlName="diastolicBP" min="0" max="200" placeholder="80">
      </mat-form-field>
    </div>

    <div class="form-section-title">Frecuencia</div>
    <div class="form-row">
      <mat-form-field appearance="outline" class="field-small">
        <mat-label>FC (lpm)</mat-label>
        <input matInput type="number" formControlName="heartRate" min="0" max="300" placeholder="72">
      </mat-form-field>
      <mat-form-field appearance="outline" class="field-small">
        <mat-label>FR (rpm)</mat-label>
        <input matInput type="number" formControlName="respiratoryRate" min="0" max="100" placeholder="16">
      </mat-form-field>
    </div>

    <div class="form-section-title">Temperatura y Oxigenación</div>
    <div class="form-row">
      <mat-form-field appearance="outline" class="field-small">
        <mat-label>Temperatura (°C)</mat-label>
        <input matInput type="number" formControlName="temperature" min="32" max="45" step="0.1" placeholder="36.5">
      </mat-form-field>
      <mat-form-field appearance="outline" class="field-small">
        <mat-label>SpO₂ (%)</mat-label>
        <input matInput type="number" formControlName="oxygenSaturation" min="0" max="100" placeholder="98">
      </mat-form-field>
    </div>

    <div class="form-section-title">Antropometría</div>
    <div class="form-row">
      <mat-form-field appearance="outline" class="field-small">
        <mat-label>Peso (kg)</mat-label>
        <input matInput type="number" formControlName="weight" min="0" max="500" step="0.1" placeholder="70">
      </mat-form-field>
      <mat-form-field appearance="outline" class="field-small">
        <mat-label>Talla (cm)</mat-label>
        <input matInput type="number" formControlName="height" min="0" max="300" step="0.5" placeholder="170">
      </mat-form-field>
      <mat-form-field appearance="outline" class="field-small">
        <mat-label>Glucosa (mg/dL)</mat-label>
        <input matInput type="number" formControlName="bloodGlucose" min="0" max="1000" placeholder="100">
      </mat-form-field>
    </div>

    <div class="form-section-title">Notas</div>
    <mat-form-field appearance="outline" class="w-100">
      <textarea matInput formControlName="notes" rows="2" placeholder="Observaciones adicionales..."></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="saving">Cancelar</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid || saving">
    <mat-spinner *ngIf="saving" diameter="18" class="inline-spinner"></mat-spinner>
    <span *ngIf="!saving">{{ isEdit ? 'Actualizar' : 'Guardar' }}</span>
  </button>
</mat-dialog-actions>
