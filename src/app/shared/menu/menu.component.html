<nav class="menu-container" [class.collapsed]="isCollapsed">
  <div class="menu-header">
    <div class="menu-logo">
      <img src="assets/logo-240-invert.png" alt="ClinicFlow" class="logo-img">
    </div>
    <button mat-icon-button class="toggle-btn" (click)="toggleSidebar()" [attr.aria-label]="'MENU.TOGGLE_SIDEBAR' | translate">
      <mat-icon>{{ isCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
  </div>

  <mat-list class="menu-list">
    <mat-list-item class="menu-item">
      <button mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="menu-link">
        <mat-icon class="menu-icon">dashboard</mat-icon>
        <span class="menu-text" *ngIf="!isCollapsed">{{ 'MENU.HOME' | translate }}</span>
      </button>
    </mat-list-item>

    <mat-list-item class="menu-item">
      <button mat-button routerLink="/appointments" routerLinkActive="active" class="menu-link">
        <mat-icon class="menu-icon">calendar_month</mat-icon>
        <span class="menu-text" *ngIf="!isCollapsed">{{ 'MENU.APPOINTMENTS' | translate }}</span>
      </button>
    </mat-list-item>

    <mat-list-item class="menu-item">
      <button mat-button routerLink="/patients" routerLinkActive="active" class="menu-link">
        <mat-icon class="menu-icon">people</mat-icon>
        <span class="menu-text" *ngIf="!isCollapsed">{{ 'MENU.PATIENTS' | translate }}</span>
      </button>
    </mat-list-item>

    <mat-list-item class="menu-item">
      <button mat-button routerLink="/prescriptions/new" routerLinkActive="active" class="menu-link">
        <mat-icon class="menu-icon">description</mat-icon>
        <span class="menu-text" *ngIf="!isCollapsed">{{ 'MENU.PRESCRIPTIONS' | translate }}</span>
      </button>
    </mat-list-item>

    <mat-list-item class="menu-item">
      <button mat-button routerLink="/reports" routerLinkActive="active" class="menu-link">
        <mat-icon class="menu-icon">analytics</mat-icon>
        <span class="menu-text" *ngIf="!isCollapsed">{{ 'MENU.REPORTS' | translate }}</span>
      </button>
    </mat-list-item>

    <mat-divider *ngIf="!isCollapsed" class="section-divider"></mat-divider>
    <p class="section-header" *ngIf="!isCollapsed">{{ 'MENU.NUTRITION' | translate }}</p>

    <mat-list-item class="menu-item">
      <button mat-button routerLink="/nutrition/foods" routerLinkActive="active" class="menu-link">
        <mat-icon class="menu-icon">menu_book</mat-icon>
        <span class="menu-text" *ngIf="!isCollapsed">{{ 'MENU.FOOD_DATABASE' | translate }}</span>
      </button>
    </mat-list-item>

    <mat-divider *ngIf="!isCollapsed" class="section-divider"></mat-divider>
    <p class="section-header" *ngIf="!isCollapsed">{{ 'MENU.SETTINGS' | translate }}</p>

    <mat-list-item class="menu-item">
      <button mat-button routerLink="/clinics" routerLinkActive="active" class="menu-link">
        <mat-icon class="menu-icon">local_hospital</mat-icon>
        <span class="menu-text" *ngIf="!isCollapsed">{{ 'MENU.CLINICS' | translate }}</span>
      </button>
    </mat-list-item>

    <mat-list-item class="menu-item">
      <button mat-button routerLink="/users" routerLinkActive="active" class="menu-link">
        <mat-icon class="menu-icon">group</mat-icon>
        <span class="menu-text" *ngIf="!isCollapsed">{{ 'MENU.USERS' | translate }}</span>
      </button>
    </mat-list-item>

    <mat-list-item class="menu-item">
      <button mat-button routerLink="/settings" routerLinkActive="active" class="menu-link">
        <mat-icon class="menu-icon">subscriptions</mat-icon>
        <span class="menu-text" *ngIf="!isCollapsed">{{ 'MENU.SUBSCRIPTION' | translate }}</span>
      </button>
    </mat-list-item>
  </mat-list>

  <div class="menu-footer">
    <mat-divider class="menu-divider"></mat-divider>
    <button mat-button class="logout-btn" (click)="logout()" [attr.aria-label]="'MENU.LOGOUT' | translate">
      <mat-icon class="menu-icon">logout</mat-icon>
      <span class="menu-text" *ngIf="!isCollapsed">{{ 'MENU.LOGOUT' | translate }}</span>
    </button>
  </div>
</nav>
