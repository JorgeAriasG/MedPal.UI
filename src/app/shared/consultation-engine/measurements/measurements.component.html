<div class="measurements">
  <h4 class="measurements-title">
    <mat-icon>straighten</mat-icon>
    Mediciones
  </h4>

  <div class="measurements-grid">
    <mat-form-field appearance="outline">
      <mat-label>Peso (kg)</mat-label>
      <input
        matInput
        type="number"
        [value]="measurements.weight || ''"
        (input)="updateField('weight', $any($event.target).valueAsNumber)"
        [disabled]="disabled"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Altura (cm)</mat-label>
      <input
        matInput
        type="number"
        [value]="measurements.height || ''"
        (input)="updateField('height', $any($event.target).valueAsNumber)"
        [disabled]="disabled"
      />
    </mat-form-field>

    <div class="bmi-display">
      <span class="bmi-value">{{ measurements.bmi || '—' }}</span>
      <span class="bmi-category" [style.color]="getCategoryColor()">{{ getCategory() }}</span>
    </div>
  </div>
</div>
